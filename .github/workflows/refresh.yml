name: Refresh review queue

on:
  schedule:
    # 08:08 Beijing time (UTC+08:00); GitHub cron uses UTC.
    - cron: '8 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-review-queue
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      checks: read
      statuses: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest -v

      - name: Refresh report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          mkdir -p reports
          for attempt in 1 2 3; do
            if python ready_for_review.py --format markdown --output reports/latest.md; then
              exit 0
            fi
            if (( attempt < 3 )); then
              echo "Refresh attempt ${attempt} failed; retrying the complete scan."
              sleep "$((attempt * 10))"
            fi
          done
          echo 'Refresh failed; the last complete report will not be published over.' >&2
          exit 1

      - name: Publish report
        env:
          PUBLISH_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- reports/latest.md
          if git diff --cached --quiet -- reports/latest.md; then
            echo 'Report unchanged; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh management review queue'
          git push origin "HEAD:${PUBLISH_BRANCH}"
